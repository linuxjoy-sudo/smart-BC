[package]
name = "smartbc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_bc"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
cpal = "0.18.1"
hound = "3.5.1"
whisper-rs = "0.16.0"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
tauri-plugin-notification = "2.3.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
pinyin = "0.11.0"

[dev-dependencies]
httpmock = "0.8.3"


[patch.crates-io]
# 本地 patch：绿色版（未安装）通知不设自定义 AUMID，
# 否则 Windows toast 因未注册 AUMID 静默失败（见 vendor/tauri-plugin-notification/src/desktop.rs）
tauri-plugin-notification = { path = "../vendor/tauri-plugin-notification" }

[target."cfg(windows)".dependencies]
tts = { version = "0.26.3", default-features = false }
